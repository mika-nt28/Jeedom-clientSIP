<div class="cmd cmd-widget reportModeHidden" data-type="action" data-subtype="message" data-template="default" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#">
	<style>
		.digit {
			height: 66px;
			width: 66px;
			margin: 0 8px 14px !important;
			background-color: #f8f8f8;
			font-weight: 300;
			font-size: 24px;
			border-radius: 100px;
			line-height: 21px;
			padding-top: 9px;
			float: left;
		}
		.digit span {
			display: block;
			color: #999;
			font-size: 10px;
			font-weight: normal;
		}
		#sip-dialpad {
			width: 292px;
			padding: 16px 20px;
		}
		#sip-dialpad .col-xs-4 {
			text-align: center;
		}
		#numDisplay::-webkit-input-placeholder {
			color: #bbb;
		}
		#numDisplay::-moz-placeholder {
			color: #bbb;
		}
		#numDisplay::-ms-input-placeholder {
			color: #bbb;
		}
		#numDisplay::-moz-placeholder {
			color: #bbb;
		}
	</style>
	<div class="content-lg">
		<div class="input-group">
			<span class="input-group-btn">
				<a class="btn btn-primary dropdown-toggle" data-toggle="dropdown" title="Afficher le clavier">
					<i class="fas fa-th"></i>
				</a>
			</span>
			<input type="number" class="numDisplay form-control input-sm" placeholder="Saisir le numero SIP" autocomplete="off" data-cmd_id="#id#" />
			<a class="btn btn-success btn-block btnCall" title="Send">#name_display#</a>
		</div>
		<textarea class="form-control input-sm message" rows="2" data-cmd_uid="#uid#" data-cmd_id="#id#"></textarea>
		<div id="sip-dialpad" class="dropdown-menu">
			<button type="button" class="btn btn-primary digit" data-digit="1">1<span></span></button>
			<button type="button" class="btn btn-primary digit" data-digit="2">2<span>ABC</span></button>
			<button type="button" class="btn btn-primary digit" data-digit="3">3<span>DEF</span></button>
			<button type="button" class="btn btn-primary digit" data-digit="4">4<span>GHI</span></button>
			<button type="button" class="btn btn-primary digit" data-digit="5">5<span>JKL</span></button>
			<button type="button" class="btn btn-primary digit" data-digit="6">6<span>MNO</span></button>
			<button type="button" class="btn btn-primary digit" data-digit="7">7<span>PQRS</span></button>
			<button type="button" class="btn btn-primary digit" data-digit="8">8<span>TUV</span></button>
			<button type="button" class="btn btn-primary digit" data-digit="9">9<span>WXYZ</span></button>
			<button type="button" class="btn btn-primary digit" data-digit="*">*<span></span></button>
			<button type="button" class="btn btn-primary digit" data-digit="0">0<span>+</span></button>
			<button type="button" class="btn btn-primary digit" data-digit="#">#<span></span></button>
		</div>
	</div> 
	<script>
		$('.cmd[data-cmd_id=#id#] .dropdown-menu').off().on('click',function(event) {
			event.preventDefault();
		});
		$('.numDisplay[data-cmd_id=#id#]').off().on('keypress',function(event) {
			// Enter pressed? so Dial.
			if (event.which === 13) {
				$('.cmd[data-cmd_id=#id#] .btnCall').trigger('click');
			}
		});
		$('.cmd[data-cmd_id=#id#] .digit').off().on('click',function(event) {
			event.preventDefault();
			var num = $('.numDisplay[data-cmd_id=#id#]').val();
			var dig = $(this).attr('data-digit');
			$('.numDisplay[data-cmd_id=#id#]').val(num+dig);
			return false;
		});
		$(".cmd[data-cmd_id=#id#] .btnCall").off().on("click", function() {
			var num = $('.numDisplay[data-cmd_id=#id#]').val();
			var message = $('.message[data-cmd_id=#id#]').val();
			jeedom.cmd.execute({id: '#id#', value: {title:num,message:message}});
			bootbox.dialog({
				title: "Appel en cours",
				message:'Appel en cours de '+num,
				buttons: {
					"Racrocher": {
						className: "btn-danger",
						callback: function () {
							updateCmd('Racrocher');
						}
					}
				}
			});
		});
	</script>
</div>
